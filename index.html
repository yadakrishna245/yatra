<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yatra — India Travel Guide</title>
  <meta name="description" content="Tap any Indian state to discover its best destinations, famous food, stays, and a personalised trip plan with days and budget for car, bike, bus, train or flight.">
  <meta name="theme-color" content="#0a0e16">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='15' fill='%230a0e16'/><path d='M16 6l3 7h7l-5.5 4.5L22 25l-6-4-6 4 1.5-7.5L6 13h7z' fill='%23d9b26a'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <!-- import map must precede any module load, including modulepreload -->
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js",
                   "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
  </script>
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js">
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js">
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/SVGLoader.js">
  <script>
    // Hide the 2D map while the 3D one loads (no flash); give up after 8 s.
    try {
      if (!matchMedia("(prefers-reduced-motion: reduce)").matches && document.createElement("canvas").getContext("webgl")) document.documentElement.classList.add("will-3d");
      setTimeout(() => document.body.classList.contains("is-3d") || document.documentElement.classList.remove("will-3d"), 8000);
    } catch (e) {}
  </script>
</head>
<body>
  <header class="top">
    <a class="brand" href="#" aria-label="Yatra home"><span class="mark">✦</span> Yatra <small>India Travel Guide</small></a>
    <div class="search">
      <input id="search" type="search" list="places" placeholder="Search a state, city or sight — e.g. Charminar" aria-label="Search a state, city or sight" autocomplete="off">
      <datalist id="places"></datalist>
    </div>
    <select id="statePick" class="state-pick" aria-label="Jump to a state"></select>
  </header>

  <main class="layout">
    <section class="map-wrap" aria-label="Map of India">
      <svg id="map" role="group" aria-label="Indian states and union territories — select one"></svg>
      <div id="tip" class="tip" hidden></div>
      <button id="reset" class="reset" hidden>← All of India</button>
      <p class="map-note">Map for illustration only · District boundaries: india-maps-data · Descriptions & photos: Wikipedia (CC BY-SA)</p>
      <p class="map-hint" aria-hidden="true">Drag to orbit · Scroll to zoom · Hover for details</p>
      <aside id="hovercard" class="hovercard" hidden>
        <img class="hc-img" alt="" hidden>
        <div class="hc-body">
          <p class="hc-eyebrow"></p>
          <h3 class="hc-title"></h3>
          <p class="hc-meta"></p>
          <p class="hc-text"></p>
          <div class="hc-chips"></div>
          <a class="hc-more" target="_blank" rel="noopener" hidden>Read on Wikipedia ↗</a>
          <p class="hc-hint"></p>
        </div>
      </aside>
    </section>

    <section class="panel" id="panel" aria-live="polite"></section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="map.js"></script>
  <script src="districts.js"></script>
  <script src="data.js"></script>
  <script src="data-south.js"></script>
  <script src="data-west.js"></script>
  <script src="data-north.js"></script>
  <script src="data-east.js"></script>
  <script src="planner.js"></script>
  <script src="app.js"></script>
  <script type="module" src="map3d.js"></script>
</body>
</html>
